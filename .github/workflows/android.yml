name: Build APK

on:
  push:
    branches: [main, pocketai]
  workflow_dispatch:

permissions:
  contents: write

env:
  LLAMA_TAG: b6800

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache llama.cpp
        id: llama
        uses: actions/cache@v4
        with:
          path: llama.cpp
          key: llama-${{ env.LLAMA_TAG }}

      - name: Get llama.cpp ${{ env.LLAMA_TAG }}
        if: steps.llama.outputs.cache-hit != 'true'
        run: ./scripts/get-llama.sh "$LLAMA_TAG"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 0.1.${{ github.run_number }}
        run: |
          export NDK_VERSION="$(basename "$ANDROID_NDK_HOME")"
          echo "Using NDK $NDK_VERSION"
          set -o pipefail
          gradle --no-daemon :app:assembleRelease 2>&1 | tee build.log
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/PocketAI-0.1.${{ github.run_number }}.apk"
          # release notes = commit message (shown in the in-app update card)
          git log -1 --format=%B | grep -v -e '^Co-Authored-By' -e '^Claude-Session' > out/notes.md

      - name: Show compile errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong" -A3 build.log | head -60 | while IFS= read -r line; do
            echo "::error::${line//%/%25}"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: PocketAI-0.1.${{ github.run_number }}
          path: out/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pocketai-v0.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: PocketAI 0.1.${{ github.run_number }}
          body_path: out/notes.md
          files: out/*.apk
          # outside the PocketAI repo (temporary build host) never touch that repo's "latest" release
          prerelease: ${{ github.repository != 'dozyFJ/PocketAI' }}
          make_latest: ${{ github.repository == 'dozyFJ/PocketAI' }}
